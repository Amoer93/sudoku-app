# 只启用和开发约定直接相关的规则，避免 SwiftLint 升级后冒出无关失败。
# CI 使用 swiftlint lint --strict，警告也算失败。

included:
  - SudokuApp
  - Packages

excluded:
  - .build
  - "**/.build"
  - DerivedData
  - "**/*.xcodeproj/**"

only_rules:
  - colon
  - comma
  - control_statement
  - cyclomatic_complexity
  - file_length
  - force_cast
  - force_try
  - force_unwrapping
  - function_body_length
  - identifier_name
  - leading_whitespace
  - line_length
  - opening_brace
  - return_arrow_whitespace
  - statement_position
  - syntactic_sugar
  - trailing_newline
  - trailing_whitespace
  - type_body_length
  - type_name
  - vertical_whitespace

force_cast:
  severity: error

force_try:
  severity: error

force_unwrapping:
  severity: error

line_length:
  warning: 120
  error: 160
  ignores_urls: true

function_body_length:
  warning: 40
  error: 60

file_length:
  warning: 400
  error: 500
  ignore_comment_only_lines: true

type_body_length:
  warning: 250
  error: 400

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id

cyclomatic_complexity:
  warning: 10
  error: 20

reporter: relative-path
