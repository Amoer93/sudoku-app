# 每次 PR，以及推送到 main 时：构建 App、跑引擎和 App 单元测试、做 SwiftLint 与 SwiftFormat。
# macos-26 自带 Xcode 26，才能按 iOS 26 最低版本构建。见 docs/adr/0002-ios-deployment-target.md。
#
# macos-26 是 arm64 托管 runner，容量紧。三个 job 同时申请时，大约 15 分钟还分不到机器的
# job 会被取消（结论是 cancelled，不是 failure），注解为
# “The job was not acquired by Runner of type hosted even after multiple attempts”。
# 因此三个 job 共用下面的队列：同一时刻只跑一个，其余排队等候，不会互相取消。
# 工作流这一层的 group 带 github.ref。pull_request 上它是 refs/pull/<号>/merge，
# 只取消同一 PR 的旧运行；不同 PR 不在一组里。

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: SudokuEngine tests
    runs-on: macos-26
    concurrency:
      group: ci-macos-26-${{ github.workflow }}
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run package tests
        run: swift test --package-path Packages/SudokuEngine

  app:
    name: App build and tests
    runs-on: macos-26
    concurrency:
      group: ci-macos-26-${{ github.workflow }}
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select an iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*iPhone [^()]*(\([0-9A-Fa-f-]\{36\}\)).*/\1/p' | head -n 1)"
          if [ -z "${UDID}" ]; then
            echo "No available iPhone simulator"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=${UDID}" >> "${GITHUB_OUTPUT}"

      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project SudokuApp/SudokuApp.xcodeproj \
            -scheme SudokuApp \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-"

  lint:
    name: SwiftLint and SwiftFormat
    runs-on: macos-26
    concurrency:
      group: ci-macos-26-${{ github.workflow }}
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install linters
        run: brew install swiftlint swiftformat

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: SwiftFormat
        run: swiftformat --lint .
